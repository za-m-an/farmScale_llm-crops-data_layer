[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farmscale"
version = "0.1.0"
description = "FarmScale Layer 1 (LLM) and Layer 2 (Crop Data) with ML seam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["crop_layer*", "ml_seam*", "llm_layer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
